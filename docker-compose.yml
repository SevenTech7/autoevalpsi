# Uso: docker compose run --rm dev <comando>   (p. ej. pytest, ruff check ., autoevalpsi --version)
#      docker compose run --rm ui <comando>    (p. ej. npm ci, npm run build, npm test)
# `ui` compila la interfaz React (AP-R4) a src/autoevalpsi/app/estaticos/; Node vive solo aquí.
services:
  dev:
    build: .
    working_dir: /app
    volumes:
      - .:/app
      - venv:/opt/venv
      - uvcache:/opt/uv-cache
  # Prueba manual con el celular real (sin ventana): ver README, «Probar con el celular».
  # La interfaz solo se publica en 127.0.0.1 del anfitrión; el celular entra por el 8766.
  probar:
    build: .
    working_dir: /app
    environment:
      AUTOEVALPSI_HOME: /datos
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:8765:8765"
      - "8766:8766"
    volumes:
      - .:/app
      - venv:/opt/venv
      - uvcache:/opt/uv-cache
      - datosprueba:/datos
      - ./.datos/exportaciones:/datos/exportaciones
  ui:
    image: node:22-slim
    working_dir: /app/ui
    environment:
      CI: "true"
      npm_config_update_notifier: "false"
      npm_config_fund: "false"
      npm_config_cache: /opt/npm-cache
    volumes:
      - .:/app
      - uinodes:/app/ui/node_modules
      - npmcache:/opt/npm-cache
volumes:
  datosprueba:
  venv:
  uvcache:
  uinodes:
  npmcache:
