[project]
name = "autoevalpsi"
version = "0.1.0"
description = "Convierte fotos de formularios psicológicos en Excel (OMR + OCR), local en Windows."
requires-python = ">=3.12,<3.13"
dependencies = [
    "opencv-python-headless",
    "numpy",
    "pydantic>=2",
    "openpyxl",
    "pillow",
]

[project.optional-dependencies]
app = ["fastapi", "uvicorn", "pywebview", "segno", "python-multipart"]
ocr = ["onnxruntime"]

[project.scripts]
autoevalpsi = "autoevalpsi.cli:main"

[dependency-groups]
dev = ["pytest", "ruff", "pyinstaller"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoevalpsi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real: banco de fotos reales (lento, no corre en CI)",
    "lento: OCR con modelo real",
]
addopts = "-m 'not real and not lento'"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Los bind-mounts de Docker Desktop marcan todo como ejecutable; EXE* daría falsos positivos.
extend-ignore = ["EXE001", "EXE002"]
